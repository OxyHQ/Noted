<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Capture notes, lists and meetings with Noted by Oxy. Keep your notes on your device and transcribe recordings locally." />
    <meta name="theme-color" content="#fbbc04" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <!-- Expo's single-page template owns the document reset. Bloom's document
         shell grows naturally; do not install Expo's ScrollView-only reset. -->
    <style id="expo-reset">
      html, body { margin: 0; min-height: 100%; }
      #root { display: flex; min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Noted.</noscript>
    <div id="root"></div>
  </body>
</html>
