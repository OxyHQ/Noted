plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'so.oxy.noted.capture'
version = '0.1.0'

android {
  namespace 'so.oxy.noted.capture'
  defaultConfig {
    // Required by `expo-module-gradle-plugin`, which refuses to configure a
    // module without them. Kept equal to `version` above so one bump moves both.
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
