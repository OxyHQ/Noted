[package]
name = "noted-desktop"
version = "0.1.0"
description = "Noted Desktop: a Tauri v2 shell around the Noted web build."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "noted_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
