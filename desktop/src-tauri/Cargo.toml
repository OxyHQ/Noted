[package]
name = "noted-desktop"
version = "0.1.0"
description = "Noted Desktop: a Tauri v2 shell around the Noted web build."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "noted_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# Bundled: the webview's own SQLite (where it exists at all) is not the one Noted's
# schema and queries were written against.
rusqlite = { version = "0.32", features = ["bundled"] }

# Global shortcuts exist on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
