<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noted webview probe</title>
  </head>
  <body>
    <p>Probing this webview's capabilities.</p>
    <script>
      // Everything Noted's recording and storage path leans on, asked of the engine
      // the desktop shell actually uses. Results go in an attribute so a WebDriver
      // client can read them back; nothing here is the Noted app.
      (async () => {
        const nav = navigator;
        const result = {
          userAgent: nav.userAgent,
          // OPFS and several other APIs exist only in a secure context, so whether the
          // shell's own origin counts as one is the first thing to know.
          origin: location.origin,
          isSecureContext: self.isSecureContext === true,
          storage: typeof nav.storage,
          storageEstimate: typeof nav.storage?.estimate,
          // Microphone path (the web recorder).
          getUserMedia: typeof nav.mediaDevices?.getUserMedia,
          getDisplayMedia: typeof nav.mediaDevices?.getDisplayMedia,
          mediaRecorder: typeof MediaRecorder,
          audioContext: typeof AudioContext,
          audioWorklet: typeof AudioWorkletNode,
          // Codecs the recorder can write.
          recordsWebmOpus:
            typeof MediaRecorder === 'function' && MediaRecorder.isTypeSupported('audio/webm;codecs=opus'),
          recordsMp4:
            typeof MediaRecorder === 'function' && MediaRecorder.isTypeSupported('audio/mp4'),
          // On-device transcription (ONNX / whisper in the browser).
          webgpu: typeof nav.gpu,
          webAssembly: typeof WebAssembly,
          sharedArrayBuffer: typeof SharedArrayBuffer,
          crossOriginIsolated: self.crossOriginIsolated === true,
          // Local-first storage (SQLite on OPFS).
          opfs: typeof nav.storage?.getDirectory,
          indexedDb: typeof indexedDB,
          webLocks: typeof nav.locks,
          serviceWorker: typeof nav.serviceWorker,
        };
        try {
          const adapter = result.webgpu === 'object' ? await nav.gpu.requestAdapter() : null;
          result.webgpuAdapter = adapter !== null;
        } catch {
          result.webgpuAdapter = false;
        }
        // The native SQLite the shell provides (desktop/src-tauri/src/db.rs), exercised
        // the way the local store engine uses it: open, pragma, a transaction spanning
        // separate calls, a bound write, a read, close.
        const invoke = window.__TAURI_INTERNALS__?.invoke;
        if (typeof invoke !== 'function') {
          result.nativeSqlite = 'no invoke';
        } else {
          const name = `probe-${Date.now()}.db`;
          try {
            await invoke('db_open', { name });
            await invoke('db_exec', { name, sql: 'PRAGMA journal_mode = WAL' });
            await invoke('db_exec', { name, sql: 'CREATE TABLE t (id TEXT PRIMARY KEY, n INTEGER)' });
            await invoke('db_exec', { name, sql: 'BEGIN IMMEDIATE' });
            const written = await invoke('db_run', {
              name,
              sql: 'INSERT INTO t VALUES (?, ?)',
              params: ['a', 1],
            });
            await invoke('db_exec', { name, sql: 'COMMIT' });
            const rows = await invoke('db_all', { name, sql: 'SELECT id, n FROM t', params: [] });
            await invoke('db_close', { name });
            result.nativeSqlite =
              written.changes === 1 && rows.length === 1 && rows[0].n === 1
                ? 'ok'
                : `unexpected: ${JSON.stringify({ written, rows })}`;
          } catch (error) {
            result.nativeSqlite = `error: ${String(error)}`;
          }
          // The webview can send any string; a name that is a path must be refused.
          result.refusesPathNames = await invoke('db_open', { name: '../escape.db' }).then(
            () => false,
            () => true,
          );
        }
        document.body.setAttribute('data-probe', JSON.stringify(result));
      })();
    </script>
  </body>
</html>
