name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches the app, so a docs-only change does not pay
  # for the Expo web export. `Lint & Test` is not filtered: it holds the
  # repository-wide gates. Anything outside the docs (shared-types, bun.lock,
  # any package.json, scripts, this workflow) counts as the app. Pushes to main
  # always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            frontend:
              - 'packages/frontend/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!packages/frontend/**'
              - '!docs/**'
              - '!**/*.md'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Android device-session autolinking
        run: bun run check:android-autolinking

      # `@noted/shared-types` resolves through `main: ./dist/index.js`, and
      # `dist/` is gitignored — so on a clean checkout the package cannot be
      # resolved at all and any test file that reaches it fails to LOAD. A
      # developer machine hides this behind a `dist/` left over from an earlier
      # build; only CI starts without one.
      - name: Build shared types
        run: bun run build:types

      # Biome formats and lints the whole repository (app, shared types,
      # scripts) from the root biome.json. `biome ci` never writes.
      # Several recommended rules default to warning severity, which `biome ci`
      # would otherwise let through; the warning count is held at zero.
      - name: Lint & format check (Biome)
        run: bunx biome ci --error-on-warnings .

      # The build does not typecheck: Metro/Babel bundles the app and strips
      # types. This is the only place `tsc` runs, and it is what reports invalid
      # regular expressions (bad group references, out-of-order quantifiers,
      # unknown Unicode properties) that ESLint's no-invalid-regexp used to
      # catch and Biome's parser does not.
      - name: Typecheck
        run: bun run typecheck

      # The app's suite was not run here, so every guard in it — including the
      # source checks that are the only thing standing between a refactor and
      # the two-writers bug coming back — passed by never executing.
      - name: Run app tests
        run: bun run --filter @noted/frontend test

      - name: Verify Android prebuild and shared signing
        run: |
          cd packages/frontend
          CI=1 bun x expo prebuild --platform android --no-install
          cd ../..
          node scripts/verify-android-prebuild.mjs

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production

      # The desktop CI drives the local store through a test hook that only an
      # EXPO_PUBLIC_E2E=1 build installs (lib/e2e/desktop-store.ts). An ordinary
      # build must not contain it: if it does, the flag stopped being inlined.
      - name: The test hook is not in the production build
        run: |
          if grep -rl "__NOTED_E2E_HOOK__" packages/frontend/dist >/dev/null 2>&1; then
            echo "::error::the e2e test hook leaked into the production web build"
            exit 1
          fi
