name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which app a pull request touches, so a backend-only change does not pay for
  # the Expo web export and a frontend-only change does not pay for the API
  # build. `Lint & Test` is not filtered: it holds the repository-wide gates.
  # Anything outside the two app directories (shared-types, bun.lock, any
  # package.json, scripts, this workflow) counts as both. Pushes to main always
  # run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - 'packages/backend/**'
            frontend:
              - 'packages/frontend/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!packages/backend/**'
              - '!packages/frontend/**'
              - '!docs/**'
              - '!**/*.md'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reads the tracked file listing, so it needs neither install nor build to be
      # meaningful and costs seconds. It answers the one question a green build
      # cannot: Mongo returns as a hoisted dependency or a workflow variable, and
      # every other step here passes while it does.
      - name: Guard against MongoDB returning
        run: bun run validate:no-mongo

      - name: Verify production deployment gate fixtures
        run: |
          bash -n scripts/*.sh
          bash scripts/test-smoke-mcp.sh
          bash scripts/test-wait-for-ecs-deployment.sh

      # `@noted/shared-types` resolves through `main: ./dist/index.js`, and
      # `dist/` is gitignored — so on a clean checkout the package cannot be
      # resolved at all and any test file that reaches it fails to LOAD. A
      # developer machine hides this behind a `dist/` left over from an earlier
      # build; only CI starts without one.
      - name: Build shared types
        run: bun run build:types

      - name: Lint API
        run: bun run --filter @noted/backend lint

      - name: Run API tests
        run: bun run --filter @noted/backend test

      # The app's suite was not run here, so every guard in it — including the
      # source checks that are the only thing standing between a refactor and
      # the two-writers bug coming back — passed by never executing.
      - name: Run app tests
        run: bun run --filter @noted/frontend test

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:backend

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
