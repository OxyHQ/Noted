name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which app a pull request touches, so a backend-only change does not pay for
  # the Expo web export and a frontend-only change does not pay for the API
  # build. `Lint & Test` is not filtered: it holds the repository-wide gates.
  # Anything outside the two app directories (shared-types, bun.lock, any
  # package.json, scripts, this workflow) counts as both. Pushes to main always
  # run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - 'packages/backend/**'
            frontend:
              - 'packages/frontend/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!packages/backend/**'
              - '!packages/frontend/**'
              - '!docs/**'
              - '!**/*.md'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production deployment gate fixtures
        run: |
          bash -n scripts/*.sh .github/scripts/*.sh
          bash scripts/test-smoke-mcp.sh
          bash scripts/test-wait-for-ecs-deployment.sh

      # `@noted/shared-types` resolves through `main: ./dist/index.js`, and
      # `dist/` is gitignored — so on a clean checkout the package cannot be
      # resolved at all and any test file that reaches it fails to LOAD. A
      # developer machine hides this behind a `dist/` left over from an earlier
      # build; only CI starts without one.
      - name: Build shared types
        run: bun run build:types

      # Biome formats and lints the whole repository (backend, app, shared
      # types, scripts) from the root biome.json. `biome ci` never writes.
      - name: Lint & format check (Biome)
        run: bunx biome ci .

      # `bun test`, the runner AND the runtime production uses (the image runs
      # the API on Bun). Includes the *.realdb suites against the service above.
      - name: Run API tests
        run: bun run --filter @noted/backend test
        env:
          # The fixture creates/drops its own guarded oxydb_test_* database.
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # The app's suite was not run here, so every guard in it — including the
      # source checks that are the only thing standing between a refactor and
      # the two-writers bug coming back — passed by never executing.
      - name: Run app tests
        run: bun run --filter @noted/frontend test

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.backend == 'true'
    # A disposable server for the entrypoint check below; nothing else uses it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:backend

      # EXECUTES the built server, migrator and catalog one-shot under bun (the
      # image's runtime and commands): each failure must exit non-zero after
      # reaching it, and each positive control (migrations, a real boot answering
      # /health/ready then SIGTERM to exit 0, a catalog registered through the
      # task-role attestation) must exit 0.
      - name: Check the built entrypoints under Bun
        env:
          NOTED_ENTRYPOINTS_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun scripts/check-backend-entrypoints.ts

  # The production image as ECS runs it, built for linux/arm64 on an arm64
  # runner exactly as deploy-aws.yml builds it: both migrator phases, Bun as the
  # server under dumb-init, /health/ready 200, the HEALTHCHECK, a graceful exit 0
  # on SIGTERM and the catalog one-shot. The deploy's buildkit cache is read,
  # never written.
  api-image:
    name: Smoke API image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: noted
          POSTGRES_PASSWORD: noted
          POSTGRES_DB: noted
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U noted -d noted"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: noted-backend:ci
          cache-from: type=gha,scope=noted-backend

      - name: Smoke the API image under its Bun runtime
        env:
          IMAGE: noted-backend:ci
          DATABASE_URL: postgres://noted:noted@127.0.0.1:5439/noted
          PORT: '3001'
        run: bash .github/scripts/smoke-api-image.sh

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
