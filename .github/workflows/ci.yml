name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches the app, so a docs-only change does not pay
  # for the Expo web export. `Lint & Test` is not filtered: it holds the
  # repository-wide gates. Anything outside the docs (shared-types, bun.lock,
  # any package.json, scripts, this workflow) counts as the app. Pushes to main
  # always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            frontend:
              - 'packages/frontend/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!packages/frontend/**'
              - '!docs/**'
              - '!**/*.md'

  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull requests and merge_group only; push and dispatch runs
  # stay hosted. Unset, every job runs hosted as before and none of these takes
  # a runner. Set, Lint & Test and Build App (a full typecheck, an Expo export)
  # run on the self-hosted seldon-ci pool; a lane still queued 3 minutes after
  # it was created gets its hosted twin (the `-hosted` jobs), the lane that
  # starts first wins and the finish job cancels the other through its
  # job-level concurrency group. A Seldon lane that fails, whatever the reason
  # (the house network drops new connections in bursts), reruns hosted in its
  # `-rescue` job, which fails again on a genuine failure. CI complete takes the
  # raced jobs' verdict from the race.
  #
  # Two waves, each with its own start and finish (the `names` input): Build App
  # needs Lint & Test, so its lane exists only once the first wave has finished.
  #
  # While the variable is unset the twins and rescues carry an `(idle)` name,
  # so a skipped one never stands in for a required check of the same name.
  race:
    if: ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: Lint & Test

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: Lint & Test

  race-2:
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue]
    if: ${{ !cancelled() && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: Build App

  race-2-finish:
    needs: race-2
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race-2.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: Build App

  lint-and-test:
    name: Lint & Test
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Lint & Test
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    timeout-minutes: 15

    steps: &lint-and-test-steps
      # A lane that starts after its hosted twin waits here to be cancelled (the Seldon race).
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails on a second copy of a package the Oxy packages share (zod among
      # them) or a native peer of the installed services the app does not declare.
      - name: Oxy dependency health (oxy-doctor)
        run: bun run doctor:oxy

      - name: Check Android device-session autolinking
        run: bun run check:android-autolinking

      # `@noted/shared-types` resolves through `main: ./dist/index.js`, and
      # `dist/` is gitignored — so on a clean checkout the package cannot be
      # resolved at all and any test file that reaches it fails to LOAD. A
      # developer machine hides this behind a `dist/` left over from an earlier
      # build; only CI starts without one.
      - name: Build shared types
        run: bun run build:types

      # Biome formats and lints the whole repository (app, shared types,
      # scripts) from the root biome.json. `biome ci` never writes.
      # Several recommended rules default to warning severity, which `biome ci`
      # would otherwise let through; the warning count is held at zero.
      - name: Lint & format check (Biome)
        run: bunx biome ci --error-on-warnings .

      # Translation keys follow ADR 0055: nested identifier segments under a
      # namespace, every locale shaped like English. Missing translations warn.
      - name: Translation keys (ADR 0055)
        run: bun run i18n:check

      # The build does not typecheck: Metro/Babel bundles the app and strips
      # types. This is the only place `tsc` runs, and it is what reports invalid
      # regular expressions (bad group references, out-of-order quantifiers,
      # unknown Unicode properties) that ESLint's no-invalid-regexp used to
      # catch and Biome's parser does not.
      - name: Typecheck
        run: bun run typecheck

      # The app's suite was not run here, so every guard in it — including the
      # source checks that are the only thing standing between a refactor and
      # the two-writers bug coming back — passed by never executing.
      - name: Run app tests
        run: bun run --filter @noted/frontend test

      - name: Verify Android prebuild and shared signing
        run: |
          cd packages/frontend
          CI=1 bun x expo prebuild --platform android --no-install
          cd ../..
          node scripts/verify-android-prebuild.mjs

  # lint-and-test's hosted twin in the Seldon race: the same name and steps.
  lint-and-test-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Lint & Test' || 'Lint & Test (Seldon twin, idle)' }}
    needs: race
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Lint & Test
    permissions: *race-lane-permissions
    steps: *lint-and-test-steps

  # lint-and-test's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  lint-and-test-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Lint & Test' || 'Lint & Test (Seldon rescue, idle)' }}
    needs: lint-and-test
    if: ${{ !cancelled() && needs.lint-and-test.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *race-lane-permissions
    steps: *lint-and-test-steps

  build-app:
    name: Build App
    runs-on: *seldon-lane
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Build App
    permissions: *race-lane-permissions
    timeout-minutes: 30
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue]
    # `!cancelled()` plus an explicit success check on Lint & Test (in whichever
    # lane passed it) replaces the implicit success(), which a skipped twin fails.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') }}

    steps: &build-app-steps
      - *race-guard
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production

      # The desktop CI drives the local store through a test hook that only an
      # EXPO_PUBLIC_E2E=1 build installs (lib/e2e/desktop-store.ts). An ordinary
      # build must not contain it: if it does, the flag stopped being inlined.
      - name: The test hook is not in the production build
        run: |
          if grep -rl "__NOTED_E2E_HOOK__" packages/frontend/dist >/dev/null 2>&1; then
            echo "::error::the e2e test hook leaked into the production web build"
            exit 1
          fi

  # build-app's hosted twin in the Seldon race: the same name and steps.
  build-app-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Build App' || 'Build App (Seldon twin, idle)' }}
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue, race-2]
    if: ${{ !cancelled() && needs.race-2.outputs.race == 'true' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Build App
    permissions: *race-lane-permissions
    steps: *build-app-steps

  # build-app's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  build-app-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Build App' || 'Build App (Seldon rescue, idle)' }}
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue, build-app]
    if: ${{ !cancelled() && needs.build-app.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: *race-lane-permissions
    steps: *build-app-steps

  # The one check this workflow stands for, modelled on OxyHQ/Gemies' and
  # OxyHQ/Bloom's: green only when every job above passed or skipped for a
  # reason this workflow declares, so a cancelled or unexplained-skipped job can
  # never read as a pass. Required checks by job name cannot follow the Seldon
  # race (a twin and a rescue share their job's name, and a cancelled loser is
  # not a failure); this one can.
  #
  # The skips it allows, and nothing else:
  #   - Build App, when `changes` said the frontend is not affected, or when
  #     Lint & Test did not pass (which fails here on its own line).
  #   - The race's jobs, twins and rescues whenever they are not needed.
  # When the race or the rescue ran, a raced job passes on the race's verdict:
  # each of its names passed in some lane and failed in no hosted lane.
  ci-complete:
    name: CI complete
    if: always()
    # Not race-finish nor race-2-finish: their reapers run on seldon-ci-light
    # and only follow the cancellation, so needing them would wait on Seldon.
    needs:
      - changes
      - race
      - race-2
      - lint-and-test
      - lint-and-test-hosted
      - lint-and-test-rescue
      - build-app
      - build-app-hosted
      - build-app-rescue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Per job name: passed when one of its lanes succeeded and no hosted lane
      # failed. Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }

          changes="$(result changes)"
          [ "$changes" = success ] || failures+=("changes did not pass: $changes")

          # The race's starts: skipped when not needed, never failed.
          for job in race race-2; do
            r="$(result "$job")"
            case "$r" in
              success | skipped) ;;
              *) failures+=("$job did not pass: $r") ;;
            esac
          done

          # A raced family's result, in $family: the verdict when its wave
          # raced (and the job was not skipped) or its rescue ran; otherwise
          # the job's own, with its twin and rescue skipped. Not called in a
          # subshell, so its failures reach the list.
          family() {
            local job="$1" wave="$2" own twin rescue raced
            own="$(result "$job")"
            twin="$(result "$job-hosted")"
            rescue="$(result "$job-rescue")"
            raced="$(jq -r --arg w "$wave" '.[$w].outputs.race // ""' <<<"$RESULTS")"
            if [ "$rescue" != skipped ] || { [ "$raced" = true ] && ! { [ "$own" = skipped ] && [ "$twin" = skipped ]; }; }; then
              family="${RACE_VERDICT:-no verdict}"
              return
            fi
            [ "$twin" = skipped ] || failures+=("$job-hosted ran although the Seldon race did not: $twin")
            family="$own"
          }

          family lint-and-test race
          lint="$family"
          [ "$lint" = success ] || failures+=("lint-and-test did not pass: $lint")

          family build-app race-2
          frontend="$(jq -r '.changes.outputs.frontend // ""' <<<"$RESULTS")"
          if [ "$family" != success ]; then
            if [ "$family" = skipped ] && { [ "$lint" != success ] || { [ "$changes" = success ] && [ "$frontend" != true ]; }; }; then
              echo "build-app skipped: the frontend is not affected, or Lint & Test did not pass"
            else
              failures+=("build-app did not pass: $family")
            fi
          fi

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          echo 'Every job passed, or skipped for a reason this workflow declares.'
