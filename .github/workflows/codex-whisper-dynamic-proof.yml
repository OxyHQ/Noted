name: Whisper dynamic-backend diagnostic
on:
  pull_request:
    paths: ['.github/workflows/codex-whisper-dynamic-proof.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore existing source/build cache without saving
        uses: actions/cache/restore@v4
        with:
          path: whisper.cpp
          key: whisper-cpp-v1.9.5-linux
          fail-on-cache-miss: true
      - name: Restore synthetic-test model without saving
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/so.oxy.noted.desktop/models
          key: desktop-model-${{ hashFiles('packages/frontend/lib/stt/models.ts') }}
          fail-on-cache-miss: true
      - name: Install relocation inspection tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf
      - name: Build shared backends with CPU dispatch
        run: |
          set -euo pipefail
          cmake -S whisper.cpp -B "$RUNNER_TEMP/dynamic-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON
          cmake --build "$RUNNER_TEMP/dynamic-build" -j 2 --target whisper-cli
          find "$RUNNER_TEMP/dynamic-build/bin" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          readelf -d "$RUNNER_TEMP/dynamic-build/bin/whisper-cli" | grep -E 'NEEDED|RPATH|RUNPATH' || true
      - name: Test current-directory backend discovery with a benign marker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe-cwd"
          cat > "$RUNNER_TEMP/probe.c" <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          __attribute__((constructor)) static void mark(void) {
            const char *path = getenv("NOTED_TEST_MARKER");
            if (path) { FILE *file = fopen(path, "w"); if (file) { fputs("loaded", file); fclose(file); } }
          }
          int ggml_backend_score(void) { return 0; }
          C
          cc -shared -fPIC "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe-cwd/libggml-cpu-notedprobe.so"
          cd "$RUNNER_TEMP/probe-cwd"
          export NOTED_TEST_MARKER="$RUNNER_TEMP/marker"
          "$RUNNER_TEMP/dynamic-build/bin/whisper-cli" -m "$HOME/.local/share/so.oxy.noted.desktop/models/ggml-base-q5_1.bin" -f "$GITHUB_WORKSPACE/whisper.cpp/samples/jfk.wav" -l en -oj -of "$RUNNER_TEMP/dynamic-result"
          test "$(cat "$NOTED_TEST_MARKER")" = loaded
          echo 'A matching backend in the working directory was loaded during discovery.'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'dynamic-result.json').read_text())
          text=' '.join(item['text'] for item in data.get('transcription', [])).lower()
          print('dynamic_transcript:',text)
          assert 'ask not what your country can do for you' in text
          PY
      - name: Test explicit backend path and environment override
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('whisper.cpp/examples/cli/cli.cpp')
          source=path.read_text()
          old='    ggml_backend_load_all();'
          replacement='''    const char * noted_test_dir = std::getenv("NOTED_TEST_BACKENDS");
              if (!noted_test_dir || !*noted_test_dir) return 2;
              ggml_backend_load_all_from_path(noted_test_dir);'''
          assert source.count(old)==1
          path.write_text(source.replace(old,replacement))
          PY
          cmake --build "$RUNNER_TEMP/dynamic-build" -j 2 --target whisper-cli
          cd "$RUNNER_TEMP/probe-cwd"
          export NOTED_TEST_MARKER="$RUNNER_TEMP/marker"
          export NOTED_TEST_BACKENDS="$RUNNER_TEMP/dynamic-build/bin"
          rm -f "$NOTED_TEST_MARKER"
          env -u GGML_BACKEND_PATH "$RUNNER_TEMP/dynamic-build/bin/whisper-cli" -m "$HOME/.local/share/so.oxy.noted.desktop/models/ggml-base-q5_1.bin" -f "$GITHUB_WORKSPACE/whisper.cpp/samples/jfk.wav" -l en -oj -of "$RUNNER_TEMP/restricted-result"
          test ! -e "$NOTED_TEST_MARKER"
          echo 'With an explicit backend directory and no override, the cwd marker did not run.'
          GGML_BACKEND_PATH="$RUNNER_TEMP/probe-cwd/libggml-cpu-notedprobe.so" "$RUNNER_TEMP/dynamic-build/bin/whisper-cli" -m "$HOME/.local/share/so.oxy.noted.desktop/models/ggml-base-q5_1.bin" -f "$GITHUB_WORKSPACE/whisper.cpp/samples/jfk.wav" -l en -oj -of "$RUNNER_TEMP/override-result"
          test "$(cat "$NOTED_TEST_MARKER")" = loaded
          echo 'The explicit environment override loaded the marker despite the directory argument.'
      - name: Inspect a relocated executable-only stage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/executable-only"
          cp "$RUNNER_TEMP/dynamic-build/bin/whisper-cli" "$RUNNER_TEMP/executable-only/whisper-cli"
          mkdir -p "$RUNNER_TEMP/complete-bundle"
          cp -a "$RUNNER_TEMP/dynamic-build/bin/." "$RUNNER_TEMP/complete-bundle/"
          for file in "$RUNNER_TEMP/complete-bundle/"*; do
            if [ -f "$file" ] && [ ! -L "$file" ] && patchelf --print-rpath "$file" >/dev/null 2>&1; then
              patchelf --set-rpath '$ORIGIN' "$file"
            fi
          done
          mv "$RUNNER_TEMP/dynamic-build" "$RUNNER_TEMP/dynamic-build-moved"
          ldd "$RUNNER_TEMP/executable-only/whisper-cli" || true
          set +e
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/executable-only/whisper-cli" --help >"$RUNNER_TEMP/staged.out" 2>"$RUNNER_TEMP/staged.err"
          code=$?
          set -e
          echo "executable_only_exit=$code"
          head -10 "$RUNNER_TEMP/staged.err"
          cd "$RUNNER_TEMP/probe-cwd"
          export NOTED_TEST_MARKER="$RUNNER_TEMP/marker"
          rm -f "$NOTED_TEST_MARKER"
          env -u LD_LIBRARY_PATH -u GGML_BACKEND_PATH NOTED_TEST_BACKENDS="$RUNNER_TEMP/complete-bundle" "$RUNNER_TEMP/complete-bundle/whisper-cli" -m "$HOME/.local/share/so.oxy.noted.desktop/models/ggml-base-q5_1.bin" -f "$GITHUB_WORKSPACE/whisper.cpp/samples/jfk.wav" -l en -oj -of "$RUNNER_TEMP/relocated-result"
          test ! -e "$NOTED_TEST_MARKER"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'relocated-result.json').read_text())
          text=' '.join(item['text'] for item in data.get('transcription', [])).lower()
          print('relocated_transcript:',text)
          assert 'ask not what your country can do for you' in text
          PY
