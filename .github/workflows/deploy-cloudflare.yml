name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'packages/frontend/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build app (Expo web export)
        run: bun run build:frontend
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Public, compile-time Expo env. EXPO_PUBLIC_OXY_CLIENT_ID is the
          # registered Oxy RP client id; the API URL points at the noted backend.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
          EXPO_PUBLIC_OXY_API_URL: ${{ vars.EXPO_PUBLIC_OXY_API_URL || 'https://api.oxy.so' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.noted.oxy.so' }}
      # THE POINT OF THE WORKER, asserted before it is deployed. Both lines this
      # checks are one-line, entirely silent regressions: without
      # `workers_dev = false` a second complete copy of Noted appears on a
      # hostname the API's CORS allowlist has never heard of, and with
      # `worker/index.js` back under `public/` it stops being loaded at all
      # (`_worker.js` is Pages Advanced Mode) while being uploaded as a public
      # asset. Neither shows up as a failed deploy.
      - name: The Worker declines its default hostname and keeps its entrypoint
        run: |
          set -euo pipefail
          c=packages/frontend/wrangler.toml
          grep -qE '^workers_dev[[:space:]]*=[[:space:]]*false' "$c" \
            || { echo "::error::$c does not set workers_dev = false — the deploy would publish a second copy of Noted on a workers.dev hostname"; exit 1; }
          grep -qE '^not_found_handling[[:space:]]*=[[:space:]]*"single-page-application"' "$c" \
            || { echo "::error::$c has lost the SPA fallback — every deep link would 404, and worker/index.js assumes it"; exit 1; }
          grep -qE '^pattern[[:space:]]*=[[:space:]]*"noted\.oxy\.so"' "$c" \
            || { echo "::error::$c no longer claims noted.oxy.so"; exit 1; }
          test -f packages/frontend/worker/index.js \
            || { echo "::error::packages/frontend/worker/index.js is missing; wrangler.toml names it as main"; exit 1; }
          for f in packages/frontend/public/_worker.js packages/frontend/dist/_worker.js; do
            if [ -e "$f" ]; then
              echo "::error::$f exists. That is Pages Advanced Mode: a Worker never loads it, and it would ship as a PUBLIC asset. The entrypoint is worker/index.js."
              exit 1
            fi
          done
          echo "workers_dev=false · SPA fallback · noted.oxy.so · worker/index.js is the entrypoint"

      # A WORKER, not a Pages project. A Pages project ALWAYS serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off —
      # `wrangler pages project` has only `list`, `create` and `delete`. Alia
      # measured what that costs: `alia.onl` and `alia-app.pages.dev` served
      # byte-identical deployments, and the second, in no CORS allowlist,
      # rendered the shell and failed every call it made. `noted.pages.dev` was
      # the same second copy of THIS app. `workers_dev = false` in
      # packages/frontend/wrangler.toml leaves noted.oxy.so as the only name
      # that reaches it, and the entrypoint, the assets directory, the SPA
      # fallback and the custom domain are all declared in that file rather than
      # passed here, so a deploy cannot disagree with the config.
      #
      # `bunx wrangler` DIRECTLY, never `cloudflare/wrangler-action`. The action
      # installs its own wrangler and picks the package manager by looking for a
      # lockfile beside `workingDirectory` — there is none in
      # `packages/frontend`, the lockfile is at the repository root — so it
      # falls back to npm, which cannot resolve this package at all
      # (`"@noted/shared-types": "workspace:*"`, plus the root `overrides` npm
      # validates and bun does not). Homiio took a production outage from
      # exactly this on 2026-08-09 (run 31292337344: `Fail extracting tarball
      # for "wrangler"`, published nothing, left a stale bundle against a
      # changed API) and moved off the action in #291; Mercaria's AGENTS.md:196
      # forbids it outright; Alia's canvas job failed five consecutive runs on
      # the same shape; Clarity's frontend deploy hit the identical error. Do
      # not "modernise" this back to the action.
      #
      # `wrangler@4` is PINNED: an unpinned `bunx wrangler` re-resolves the
      # latest major on every deploy, changing the deploy path with no diff.
      #
      # wrangler takes its credentials from the environment, which is why they
      # are `env:` rather than arguments.
      #
      # A Worker is created by this deploy if it does not exist, so there is no
      # bootstrap step. The custom domain is claimed from wrangler.toml — which
      # is why the noted.oxy.so DNS record Pages was using must be deleted
      # BEFORE the first run of this: a Worker custom domain refuses a hostname
      # that already has externally managed records (code 100117).
      - name: Deploy the Worker
        run: cd packages/frontend && bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
