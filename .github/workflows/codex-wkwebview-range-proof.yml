name: Diagnostic WKWebView Range
on:
  push:
    branches: [codex/noted-wkwebview-range-proof]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[windows-probe]') }}
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run isolated WKWebView probe
        shell: bash
        run: |
          sw_vers
          swiftc desktop/e2e/wkwebview-range-probe.swift -framework AppKit -framework WebKit -o "$RUNNER_TEMP/wkwebview-range-probe"
          "$RUNNER_TEMP/wkwebview-range-probe"
  windows-inventory:
    if: ${{ contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Inspect preinstalled WebView2 runtime and managed SDK
        shell: pwsh
        run: |
          $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if ($runtime) { Write-Output "WebView2 runtime version: $($runtime.pv)" } else { Write-Output 'WebView2 runtime registry entry: absent' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = if (Test-Path $vswhere) { & $vswhere -latest -products '*' -property installationPath } else { $null }
          $roots = @("$env:USERPROFILE\.nuget\packages\microsoft.web.webview2")
          if ($vs) { $roots += "$vs\Common7\IDE\CommonExtensions" }
          $assembly = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $assembly = Get-ChildItem -Path $root -Filter Microsoft.Web.WebView2.WinForms.dll -File -Recurse -Depth 8 -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($assembly) { break }
            }
          }
          if ($assembly) {
            Write-Output 'Managed WebView2 SDK: present in searched paths'
            Write-Output "Assembly version: $($assembly.VersionInfo.FileVersion)"
            $core = Join-Path $assembly.DirectoryName 'Microsoft.Web.WebView2.Core.dll'
            Write-Output "Core DLL alongside WinForms: $(Test-Path $core)"
          } else {
            Write-Output 'Managed WebView2 SDK: not found in targeted paths (max depth 8)'
          }
  windows-probe:
    if: ${{ contains(github.event.head_commit.message, '[windows-probe]') }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run preinstalled WebView2 probe without package installs
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -STA -File desktop/e2e/webview2-range-probe.ps1 2>&1
          $probeExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($probeExit -ne 0 -or -not ($output | Select-String '^RESULT: ')) {
            Write-Error "WebView2 probe did not complete with a result (exit $probeExit)"
            exit 1
          }
