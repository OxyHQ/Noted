name: Whisper sidecar

# Noted Desktop's webview has no WebGPU and no threads, so on-device transcription
# there would be slow WASM (docs/desktop-audio.mdx). The planned answer is the same
# engine the phones use, whisper.cpp, run as a Tauri sidecar. This builds it and
# checks it transcribes with the app's own model and gives the segments the app
# stores. Only when the sidecar's files, the model catalogue or this file change.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/sidecar/**'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/src-tauri/src/stt.rs'
      - 'packages/frontend/lib/stt/models.ts'
      - '.github/workflows/whisper-sidecar.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/sidecar/**'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/src-tauri/src/stt.rs'
      - 'packages/frontend/lib/stt/models.ts'
      - '.github/workflows/whisper-sidecar.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A tag, not a branch: the binary's flags and JSON output are what the shell will
  # depend on, so moving to a newer one is a deliberate change to this line.
  WHISPER_CPP_TAG: v1.9.5

jobs:
  transcribe:
    name: whisper.cpp transcribes (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      # The default native build targets the current runner's CPU. Reusing the
      # compiled binary on a different runner can cause an illegal instruction.
      - name: Build whisper-cli
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build -j --target whisper-cli

      # The weights are fetched from a host that rate-limits CI addresses. Cached by
      # the catalogue's content, and verified against its sha256 on every run anyway.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-model-${{ hashFiles('packages/frontend/lib/stt/models.ts') }}

      - name: Transcribe the sample with the app's own model
        run: node desktop/sidecar/verify.mjs whisper.cpp/build/bin/whisper-cli whisper.cpp/samples/jfk.wav "$RUNNER_TEMP/whisper"

      # The Rust side of the sidecar: the command's own functions (WAV writer, JSON
      # parser, process runner), run against the real binary, model and sample built
      # above. Compiling the crate needs Tauri's Linux dependencies even though the
      # test opens no window.
      - name: Install Tauri's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file

      - name: Provide a frontendDist placeholder
        run: mkdir -p packages/frontend/dist

      - uses: dtolnay/rust-toolchain@stable

      - name: Stage the sidecar for the crate's build
        run: node desktop/sidecar/stage.mjs whisper.cpp/build/bin/whisper-cli

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: stt

      - name: The Rust transcription path, against the real binary
        env:
          WHISPER_CLI: ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ runner.temp }}/whisper/ggml-tiny-q5_1.bin
          WHISPER_SAMPLE_WAV: ${{ github.workspace }}/whisper.cpp/samples/jfk.wav
        run: "cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml stt:: -- --nocapture"

  # The same binary built and run on the other two desktop platforms. Linux above also
  # covers the app-level checks; here the question is only "does whisper.cpp build and
  # transcribe with the app's model on this OS, and does the Rust path parse its output".
  transcribe-native:
    name: whisper.cpp transcribes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Cache the whisper.cpp build
        id: cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whisper-cpp-${{ env.WHISPER_CPP_TAG }}-${{ matrix.name }}

      - name: Build whisper-cli
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build --config Release -j --target whisper-cli

      - name: Find the binary
        run: |
          BIN=$(find whisper.cpp/build -type f \( -name whisper-cli -o -name whisper-cli.exe \) | head -1)
          test -n "$BIN" || { echo "whisper-cli was not built"; exit 1; }
          echo "WHISPER_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          echo "found $BIN"

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-model-${{ hashFiles('packages/frontend/lib/stt/models.ts') }}

      - name: Transcribe the sample with the app's own model
        run: node desktop/sidecar/verify.mjs "$WHISPER_BIN" whisper.cpp/samples/jfk.wav "$RUNNER_TEMP/whisper"

      - name: Provide a frontendDist placeholder
        run: mkdir -p packages/frontend/dist

      - uses: dtolnay/rust-toolchain@stable

      - name: Stage the sidecar for the crate's build
        run: node desktop/sidecar/stage.mjs "$WHISPER_BIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: stt-${{ matrix.name }}

      - name: The Rust transcription path, against the real binary
        env:
          WHISPER_CLI: ${{ env.WHISPER_BIN }}
          WHISPER_MODEL: ${{ runner.temp }}/whisper/ggml-tiny-q5_1.bin
          WHISPER_SAMPLE_WAV: ${{ github.workspace }}/whisper.cpp/samples/jfk.wav
        run: "cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml stt:: -- --nocapture"
