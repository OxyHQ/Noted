name: Desktop

# Noted Desktop is a Rust crate (desktop/), outside the Bun workspace, so the main
# CI does not build it. This compiles it, and only when it or this file changes.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

env:
  # Same pin as .github/workflows/whisper-sidecar.yml.
  WHISPER_CPP_TAG: v1.9.5

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # One platform failing is information about that platform, not a reason to
      # hide what the others do.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            binary: desktop/src-tauri/target/debug/noted-desktop
            # No display on a CI runner: give the shell a virtual one and a session bus.
            wrap: dbus-run-session -- xvfb-run -a
          - name: macos
            os: macos-latest
            binary: desktop/src-tauri/target/debug/noted-desktop
            wrap: ''
          - name: windows
            os: windows-latest
            binary: desktop/src-tauri/target/debug/noted-desktop.exe
            wrap: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux dependencies: the webview, tray support and the build tools,
      # plus the virtual display the smoke run needs. macOS and Windows ship their
      # webviews and toolchains.
      - name: Install system dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file xvfb dbus-x11

      # `tauri::generate_context!` reads `frontendDist` at compile time and fails if
      # the directory is missing, so give it an empty one: this job checks that the
      # Rust compiles and the shell starts, not that the web app builds (the main CI
      # does that).
      - name: Provide a frontendDist placeholder
        run: mkdir -p packages/frontend/dist

      - uses: dtolnay/rust-toolchain@stable

      # `bundle.externalBin` needs a file for this target at build time (see
      # desktop/sidecar/stage.mjs). This job does not transcribe.
      - name: Stage a sidecar placeholder
        run: node desktop/sidecar/stage.mjs --placeholder

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      # `--locked`: the committed Cargo.lock is the build. A dependency change has to
      # be a deliberate commit to that file, not something CI quietly resolves.
      - name: cargo check
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets

      - name: Unit tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build the shell
        run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml

      # Compiling proves the Rust is valid; this proves the shell STARTS. See
      # desktop/smoke.sh for what "starts" means and what it does not cover.
      - name: Run the shell for a few seconds
        run: ${{ matrix.wrap }} bash desktop/smoke.sh "${{ matrix.binary }}" 20

  # What each webview actually offers, asked of the real shell rather than assumed
  # from a browser compatibility table. Linux only: tauri-driver has no macOS
  # support, and the Windows driver needs a matching Edge driver. This is the
  # evidence behind the risk table in docs/desktop-audio.mdx.
  webview-probe:
    name: Desktop webview capabilities (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file xvfb dbus-x11 \
            webkit2gtk-driver

      # The shell embeds `frontendDist` at compile time, so the probe page has to be
      # there BEFORE the build; that is the only difference from the smoke job.
      - name: Put the probe page where the shell will embed it
        run: |
          mkdir -p packages/frontend/dist
          cp desktop/e2e/probe.html packages/frontend/dist/index.html

      - uses: dtolnay/rust-toolchain@stable

      # `bundle.externalBin` needs a file for this target at build time (see
      # desktop/sidecar/stage.mjs). This job does not transcribe.
      - name: Stage a sidecar placeholder
        run: node desktop/sidecar/stage.mjs --placeholder

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: probe

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build the shell
        run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Which WebKitGTK is this
        run: dpkg -l | grep -E 'libwebkit2gtk-4.1-0|webkit2gtk-driver' | awk '{print $2, $3}'

      - name: Probe the webview
        run: dbus-run-session -- xvfb-run -a node desktop/e2e/probe.mjs "$PWD/desktop/src-tauri/target/debug/noted-desktop"

  # The real web app inside the real shell. The probe above uses a minimal page; this
  # embeds the Expo web export, so it answers "does Noted's own bundle start in this
  # webview?" and leaves a screenshot as evidence. It cannot say more: the screens
  # that use the local store are behind an Oxy sign-in that CI does not have.
  app-in-shell:
    name: Noted web app inside the shell (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # EXPO_PUBLIC_E2E installs the test hook that drives the local store without an
      # Oxy sign-in (lib/e2e/desktop-store.ts). Only this job builds with it.
      - name: Build the web app
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          EXPO_PUBLIC_E2E: '1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file xvfb dbus-x11 \
            webkit2gtk-driver

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: app

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # The speech-to-text check needs the real sidecar and the app's own model, placed
      # where the Rust command looks for it (the app data directory's `models/`).
      - name: Cache the whisper.cpp build
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whisper-cpp-${{ env.WHISPER_CPP_TAG }}-linux

      - name: Build whisper-cli
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build -j --target whisper-cli

      # The REAL sidecar, staged where `bundle.externalBin` expects it: Tauri copies it
      # next to the shell's executable, which is where the Rust command looks. This is
      # the packaged path; nothing points at the binary through an environment variable.
      - name: Stage the real sidecar
        run: node desktop/sidecar/stage.mjs whisper.cpp/build/bin/whisper-cli

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/so.oxy.noted.desktop/models
          key: desktop-model-${{ hashFiles('packages/frontend/lib/stt/models.ts') }}

      - name: Put the app's default model where the shell looks for it
        run: node desktop/sidecar/fetch-model.mjs base "$HOME/.local/share/so.oxy.noted.desktop/models"

      # The shell embeds `frontendDist` (the web export built above) at compile time.
      - name: Build the shell around the web app
        run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Load the app in the shell
        env:
          E2E_STORE: '1'
          E2E_STT: '1'
          E2E_SAMPLE: ${{ github.workspace }}/whisper.cpp/samples/jfk.wav
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x1024x24" node desktop/e2e/app.mjs "$PWD/desktop/src-tauri/target/debug/noted-desktop" "$RUNNER_TEMP/noted-in-shell.png"

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noted-in-shell-screenshot
          path: ${{ runner.temp }}/noted-in-shell.png
          if-no-files-found: warn
