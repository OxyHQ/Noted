name: Experimental SQLite crash probe

on:
  pull_request:
    paths:
      - 'experiments/sqlite-journal/**'
      - '.github/workflows/sqlite-journal-probe.yml'

permissions:
  contents: read

jobs:
  host-sqlite:
    name: SQLite host process-crash probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 experiments/sqlite-journal/sigkill_probe.py
