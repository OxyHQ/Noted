# AWS deploy workflow for the Noted API.
# Builds the linux/arm64 backend image, pushes it to ECR, and forces a new ECS
# deployment. AWS access is via the OIDC role oxy-github-deploy — no stored keys.
#
# It runs only AFTER CI has passed on main for the exact commit it releases
# (`workflow_run`), instead of on every push beside CI with a test job of its
# own that repeated CI's install, type build, backend lint, tests and backend
# build. CI on push to main runs every job (its `changes` filter only narrows
# pull requests), so the gate is the whole CI rather than that subset, and the
# deploy no longer holds a second runner slot for the copy.
name: Deploy to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: noted
  CLUSTER: oxy-cluster
  ALIA_API_URL: https://api.alia.onl
  # Delivery is a reviewed production switch. The application still defaults
  # to disabled when run outside this deploy path.
  NOTED_EVENT_OUTBOX_WORKER_ENABLED: ${{ vars.NOTED_EVENT_OUTBOX_WORKER_ENABLED || 'false' }}
  # The commit under release: the head CI tested on `workflow_run`, main's head
  # on a dispatch. Never `github.sha` alone, which on `workflow_run` is whatever
  # main points at when the event is created.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Decides, OUTSIDE the release concurrency group, whether this run releases
  # anything. It must sit outside: GitHub cancels a PENDING run when another
  # queues behind it in the same group, so a run for an older commit (its CI
  # finished late) that queued there could silently displace a pending release
  # of a newer one and then hold itself, leaving neither deployed.
  #
  # An older commit is held ONLY when a newer commit on main has a CI run of
  # its own (queued, in progress or succeeded) — that commit's release will
  # carry this one. A newer commit with NO CI run (pushed with GITHUB_TOKEN, as
  # a bot merge is, which starts no workflow) or whose CI failed holds nothing,
  # so the newest CI-tested commit is never stranded behind it. Holding on
  # "is this still main's head" alone strands exactly that commit.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.newer.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # One-shot, not a poll: a dispatch is a manual redeploy of a commit CI
      # has already judged. `workflow_run` needs no such check; the guards
      # above already read CI's conclusion for this exact SHA.
      - name: Require a successful CI run on push for this commit (dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not succeeded on push to main for $DEPLOY_SHA; refusing to deploy it"
            exit 1
          fi
          echo "CI succeeded on push for $DEPLOY_SHA"

      - name: Hold only for a newer main commit that CI is testing or passed
        id: newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release() { echo "release=$1" >>"$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          main=$(git rev-parse origin/main)
          if [ "$main" = "$DEPLOY_SHA" ]; then
            release true "$DEPLOY_SHA is main's head"
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$main"; then
            release false "::notice::$DEPLOY_SHA is no longer on main ($main); not releasing it"
          fi
          # Newest first. A run counts unless it finished without succeeding.
          for sha in $(git rev-list --first-parent "$DEPLOY_SHA..$main"); do
            live=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')
            if [ "$live" -gt 0 ]; then
              release false "::notice::newer main commit $sha has its own CI run; its release carries $DEPLOY_SHA"
            fi
            echo "newer main commit $sha has no live or successful CI run; it does not hold $DEPLOY_SHA"
          done
          release true "no newer main commit is being released; releasing $DEPLOY_SHA"

  deploy:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    # Build, pre-migration task, rollout wait, smoke and a full rollback
    # window if the smoke check fails. The `noted` capability catalog and its
    # MCP server are Nilo's now (OxyHQ/Nilo#87): this deploy registers nothing.
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    # Deploys run one at a time and are never cancelled: a rollout interrupted
    # half-way is worse than a late one. A newer pending run may replace an
    # older pending one, which is safe because the scope step releases
    # everything between what is live and the newer head. On the JOB, not the
    # workflow, so only a run `gate` judged releasable ever enters the group.
    concurrency:
      group: deploy-noted-aws
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope step diffs from the commit that is live, which can be any
          # number of commits back.
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # What the old `paths-ignore` (`**.md`, `docs/**`) decided, measured from
      # what production RUNS rather than from one push: `workflow_run` takes no
      # `paths`, and a push's own diff would miss commits whose release was
      # skipped or failed. The live image's 40-hex ECR tags name the commit(s)
      # it was built from (this workflow tags every image with its SHA).
      #
      #   * live already contains this commit (a re-run, or CI finishing out of
      #     order): skip, never roll production back to an older tree;
      #   * every file changed since the live commit is Markdown or docs/: skip;
      #   * anything else, or anything this cannot establish (no live service,
      #     no SHA tag, a live commit that is not an ancestor, an API error):
      #     deploy. When unsure, deploy.
      #
      # A dispatch always deploys: it is the manual redeploy.
      - name: Decide whether this commit changes what production runs
        id: scope
        run: |
          set -uo pipefail
          decide() { echo "deploy=$1" >>"$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            decide true "manual dispatch: deploying $DEPLOY_SHA"
          fi

          td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].taskDefinition' --output text 2>/dev/null) || td=
          case "$td" in arn:aws:ecs:*) ;; *) decide true "no live task definition found; deploying" ;; esac
          image=$(aws ecs describe-task-definition --task-definition "$td" \
            --query "taskDefinition.containerDefinitions[?name=='$APP'].image | [0]" --output text 2>/dev/null) || image=
          digest=${image#*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || decide true "live image '$image' is not digest-pinned; deploying"
          live_shas=$(aws ecr describe-images --repository-name "oxy/$APP" --image-ids "imageDigest=$digest" \
            --query 'imageDetails[0].imageTags' --output json 2>/dev/null | jq -r '.[]? | select(test("^[0-9a-f]{40}$"))') || live_shas=
          [ -n "$live_shas" ] || decide true "live image $digest carries no commit tag; deploying"

          bases=()
          for live in $live_shas; do
            if ! git cat-file -e "$live^{commit}" 2>/dev/null; then
              continue
            fi
            if git merge-base --is-ancestor "$DEPLOY_SHA" "$live"; then
              decide false "live image (commit $live) already contains $DEPLOY_SHA; nothing to release"
            fi
            if git merge-base --is-ancestor "$live" "$DEPLOY_SHA"; then
              bases+=("$live")
            fi
          done
          [ "${#bases[@]}" -gt 0 ] || decide true "no live commit is an ancestor of $DEPLOY_SHA; deploying"

          # Several tags on one digest (an identical rebuild): the union of the
          # diffs, i.e. the widest one.
          changed=$(for base in "${bases[@]}"; do git diff --name-only "$base" "$DEPLOY_SHA" || echo '<diff failed>'; done | sort -u)
          relevant=$(grep -vE '\.md$|^docs/' <<<"$changed" || true)
          if [ -z "$relevant" ]; then
            decide false "only Markdown/docs changed since live ${bases[*]}; not deploying"
          fi
          echo "changed since live ${bases[*]}:"
          sed 's/^/  /' <<<"$relevant" | head -50
          decide true "deploying $DEPLOY_SHA"

      # Runtime secrets are NOT in GitHub. SSM Parameter Store (/oxy/noted/*,
      # SecureString, plus the oxy-infra-owned /oxy/_shared/*) is their single
      # source of truth: the task definition reads them at task start, and
      # nothing in this workflow writes one. Setting or rotating a value is
      # `aws ssm put-parameter --overwrite` by its owner (oxy-infra
      # docs/runbooks/46-app-secrets-in-ssm.md), never a repo secret. Until
      # 2026-10-10 a step here copied GitHub repo secrets into SSM on every
      # deploy, including /oxy/_shared/AWS_* and REDIS_URL, which no app may
      # write. packages/backend/src/__tests__/deployWorkflow.test.ts fails if a
      # workflow writes SSM or reads an app secret from GitHub again.
      - name: Login to ECR
        if: steps.scope.outputs.deploy == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.scope.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps. Without them buildx skipped the cache silently: this repository
      # held no buildkit cache entry at all (`gh cache list`, 2026-09-30).
      - name: Expose the Actions cache to buildx
        if: steps.scope.outputs.deploy == 'true'
        uses: crazy-max/ghaction-github-runtime@v4

      # Production builds only what the owner reviewed. The Dockerfile, its
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile path,
      # context and the label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. CI runs the same
      # check on every pull request (`reviewed-image.py check`, Lint & Test), so a
      # change that would stop here fails before it can merge.
      - name: Refuse unreviewed image build inputs
        if: steps.scope.outputs.deploy == 'true'
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe noted

      - name: Build and push (linux/arm64)
        if: steps.scope.outputs.deploy == 'true'
        id: build
        env:
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          set -euo pipefail
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            -t "$IMG:$DEPLOY_SHA" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "$CONTEXT"

          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest"
            exit 1
          fi
          echo "image_uri=$IMG@$DIGEST" >>"$GITHUB_OUTPUT"

      - name: Register immutable task definition
        if: steps.scope.outputs.deploy == 'true'
        id: task_definition
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          case "$NOTED_EVENT_OUTBOX_WORKER_ENABLED" in
            true|false) ;;
            *)
              echo "::error::NOTED_EVENT_OUTBOX_WORKER_ENABLED must be exactly true or false"
              exit 64
              ;;
          esac
          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP")
          if [ "$(jq -r '.services[0].status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::ECS service $APP is not active"
            exit 1
          fi

          current_task_definition=$(jq -r '.services[0].taskDefinition' <<<"$service_json")
          echo "previous_task_definition=$current_task_definition" >>"$GITHUB_OUTPUT"
          source_file=$(mktemp)
          rendered_file=$(mktemp)
          trap 'rm -f "$source_file" "$rendered_file"' EXIT
          aws ecs describe-task-definition --task-definition "$current_task_definition" \
            --query taskDefinition --output json >"$source_file"

          jq \
            --arg app "$APP" \
            --arg image "$IMAGE_URI" \
            --arg alia_api_url "$ALIA_API_URL" \
            --arg event_worker_enabled "$NOTED_EVENT_OUTBOX_WORKER_ENABLED" \
            '
              .containerDefinitions |= map(
                if .name == $app then
                  .image = $image
                  | .environment = (
                      ((.environment // []) | map(select(
                        .name != "ALIA_API_URL" and
                        .name != "NOTED_EVENT_OUTBOX_WORKER_ENABLED"
                      ))) + [
                        {name: "ALIA_API_URL", value: $alia_api_url},
                        {name: "NOTED_EVENT_OUTBOX_WORKER_ENABLED", value: $event_worker_enabled}
                      ]
                    )
                  # Noted authenticates to Oxy as its task role (oxy-noted-task,
                  # bound to the Noted application; oxy ADR 0026), so a release
                  # carries no application key pair and removes one an earlier
                  # revision still names.
                  | .secrets = (
                      (.secrets // []) | map(select(
                        .name != "OXY_APPLICATION_KEY" and
                        .name != "OXY_APPLICATION_SECRET"
                      ))
                    )
                else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt
                )
            ' "$source_file" >"$rendered_file"

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://$rendered_file" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$task_definition_arn" >>"$GITHUB_OUTPUT"

      # Migrations run BEFORE the rollout, as a one-shot task on the image that
      # is about to serve — so the schema the new tasks expect is already there
      # when the first of them starts.
      #
      # `--phase=pre` only: those migrations are additive and correct against
      # both the image still serving and the one arriving. Anything that drops,
      # renames or narrows is marked `post` and is NOT applied here; run it
      # deliberately once the rollout is live.
      #
      # `/health/ready` asserts the same journal independently. Neither replaces
      # the other: this step applies the migrations, that one survives the case
      # where a task somehow starts against a database this step never reached.
      #
      # The network configuration is read back from the running service rather
      # than written out here, so there is one place subnets and security groups
      # are defined and this cannot drift from it.
      #
      # `bun`: the runtime the Dockerfile's runner stage ships, and this task runs
      # the image being released. Reverting to a Node image means reverting this
      # command with it.
      - name: Apply pre-deploy migrations
        if: steps.scope.outputs.deploy == 'true'
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — nothing to migrate against, skipping"
            exit 0
          fi

          NETWORK=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].networkConfiguration' --output json)

          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$(jq -nc --arg app "$APP" '{
              containerOverrides: [{
                name: $app,
                command: ["bun", "packages/backend/dist/migrate.js", "--target-database=noted", "--phase=pre"]
              }]
            }')")
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$TASK_ARN" ]; then
            echo "::error::ECS did not start the migration task: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          echo "migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$APP'].exitCode | [0]" --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::migration task exited $EXIT_CODE ($REASON) — not rolling out"
            exit 1
          fi
          echo "migrations applied"

      - name: Deploy immutable task definition to ECS
        if: steps.scope.outputs.deploy == 'true'
        id: ecs_deploy
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          update_json=$(aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP" \
            --task-definition "$TASK_DEFINITION")
          echo "deployment_started=true" >>"$GITHUB_OUTPUT"
          deployment_id=$(jq -r '.service.deployments[] | select(.status == "PRIMARY") | .id' <<<"$update_json" | head -1)
          if [ -z "$deployment_id" ]; then
            echo "::error::ECS returned no primary deployment id"
            exit 1
          fi

          bash scripts/wait-for-ecs-deployment.sh "$CLUSTER" "$APP" "$deployment_id"
          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP")
          primary=$(jq -c --arg id "$deployment_id" '.services[0].deployments[] | select(.id == $id)' <<<"$service_json")
          running=$(jq -r '.runningCount' <<<"$primary")
          desired=$(jq -r '.desiredCount' <<<"$primary")
          if [ "$(jq -r '.status' <<<"$primary")" != "PRIMARY" ] ||
             [ "$(jq -r '.rolloutState' <<<"$primary")" != "COMPLETED" ] ||
             [ "$desired" -lt 1 ] || [ "$running" -ne "$desired" ]; then
            echo "::error::deployment $deployment_id did not complete as the running primary"
            exit 1
          fi

          live_task_definition=$(jq -r '.services[0].taskDefinition' <<<"$service_json")
          live_image=$(aws ecs describe-task-definition --task-definition "$live_task_definition" \
            --query "taskDefinition.containerDefinitions[?name=='$APP'].image | [0]" --output text)
          if [ "$live_image" != "$IMAGE_URI" ]; then
            echo "::error::live image $live_image does not match built image $IMAGE_URI"
            exit 1
          fi
          curl --fail --silent --show-error "https://api.noted.oxy.so/health/ready" >/dev/null
          echo "deployed $APP as $live_task_definition ($live_image)"

      - name: Diagnose a failed ECS rollout
        if: ${{ failure() && steps.ecs_deploy.outcome == 'failure' }}
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
        run: |
          set -u
          echo "Service deployments and recent events:"
          aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].{deployments:deployments[*].{id:id,status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount,failed:failedTasks},events:events[0:10].{createdAt:createdAt,message:message}}' \
            --output json || true

          task_arns=$(aws ecs list-tasks --cluster "$CLUSTER" --family "oxy-$APP" \
            --desired-status STOPPED --max-results 25 --query 'taskArns' --output text || true)
          if [ -z "$task_arns" ] || [ "$task_arns" = "None" ]; then
            echo "No stopped oxy-$APP tasks were returned."
            exit 0
          fi

          tasks_json=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks $task_arns --output json)
          jq --arg task_definition "$TASK_DEFINITION" '
                [.tasks[]
                  | select(.taskDefinitionArn == $task_definition)
                  | {
                      taskArn,
                      createdAt,
                      stoppedAt,
                      stopCode,
                      stoppedReason,
                      containers: [.containers[] | {
                        name,
                        lastStatus,
                        exitCode,
                        reason,
                        healthStatus
                      }]
                    }
                ]
                | sort_by(.stoppedAt)
                | reverse
                | .[0:10]
              ' <<<"$tasks_json" || true

          log_config=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
            --query "taskDefinition.containerDefinitions[?name=='$APP'].[name,logConfiguration.options.\"awslogs-group\",logConfiguration.options.\"awslogs-stream-prefix\"] | [0]" \
            --output json || true)
          container_name=$(jq -r '.[0] // empty' <<<"$log_config")
          log_group=$(jq -r '.[1] // empty' <<<"$log_config")
          log_prefix=$(jq -r '.[2] // empty' <<<"$log_config")
          if [ -z "$container_name" ] || [ -z "$log_group" ] || [ -z "$log_prefix" ]; then
            echo "No awslogs configuration was found for $APP in $TASK_DEFINITION."
            exit 0
          fi

          echo "Recent logs from stopped tasks in this rollout:"
          while IFS= read -r task_arn; do
            if [ -z "$task_arn" ]; then
              continue
            fi
            task_id="${task_arn##*/}"
            log_stream="$log_prefix/$container_name/$task_id"
            echo "--- $log_stream"
            aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --limit 100 \
              --query 'events[].message' \
              --output text || true
          done < <(jq -r --arg task_definition "$TASK_DEFINITION" '
            .tasks[]
            | select(.taskDefinitionArn == $task_definition)
            | .taskArn
          ' <<<"$tasks_json" | sort -u)

      - name: Roll back a failed release
        if: >-
          ${{
            failure() &&
            steps.ecs_deploy.outputs.deployment_started == 'true'
          }}
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.task_definition.outputs.previous_task_definition }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_TASK_DEFINITION" ]; then
            echo "::error::No previous task definition was recorded for rollback"
            exit 1
          fi

          rollback_json=$(aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP" \
            --task-definition "$PREVIOUS_TASK_DEFINITION")
          rollback_deployment_id=$(jq -r '.service.deployments[] | select(.status == "PRIMARY") | .id' <<<"$rollback_json" | head -1)
          if [ -z "$rollback_deployment_id" ]; then
            echo "::error::ECS returned no primary rollback deployment id"
            exit 1
          fi
          bash scripts/wait-for-ecs-deployment.sh "$CLUSTER" "$APP" "$rollback_deployment_id"

          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP")
          live_task_definition=$(jq -r '.services[0].taskDefinition' <<<"$service_json")
          if [ "$live_task_definition" != "$PREVIOUS_TASK_DEFINITION" ]; then
            echo "::error::Rollback left $live_task_definition live instead of $PREVIOUS_TASK_DEFINITION"
            exit 1
          fi

          echo "Rolled back to $PREVIOUS_TASK_DEFINITION"
