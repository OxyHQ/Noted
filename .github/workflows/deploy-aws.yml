# AWS deploy workflow for the Noted API.
# Builds the linux/arm64 backend image, pushes it to ECR, and forces a new ECS
# deployment. AWS access is via the OIDC role oxy-github-deploy — no stored keys.
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: noted
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # --ignore-scripts, for the same reason the Dockerfile passes it.
      #
      # `bufferutil` and `utf-8-validate` are OPTIONAL C++ accelerators for `ws`
      # (pulled in transitively by socket.io). Neither ships a linux-arm64
      # prebuild — both carry linux-x64, darwin and win32 only — so on THIS
      # arm64 runner their `node-gyp-build` install script always falls back to
      # a from-source `node-gyp` compile. No manifest in this repo depends on
      # `node-gyp`, so bun has to fetch one on the fly, and that fetch is what
      # fails, intermittently:
      #
      #   error: could not determine executable to run for package node-gyp
      #   error: install script from "bufferutil" exited with 1
      #
      # `ws` falls back to its pure-JS path when the addon is absent, so
      # skipping the script is behaviour-preserving. The other scripts skipped
      # here install PREBUILT binaries that bun already places via platform
      # optionalDependencies (`@esbuild/linux-arm64` is in bun.lock), or belong
      # to frontend-only tooling this job never runs.
      #
      # x86_64 never reaches any of this — it matches prebuilds/linux-x64 — so
      # `ci.yml` stayed green throughout and needs no equivalent change unless
      # it is ever moved to arm64 runners.
      - run: bun install --frozen-lockfile --ignore-scripts

      # `@noted/shared-types` is a workspace package the backend imports from its
      # BUILT output, so lint and test cannot run until it exists. It used to be
      # built only by `build:backend` below, which is after both of them — so the
      # test step passed for as long as no backend test happened to import a type,
      # and failed the day one did, with `Failed to resolve entry for package
      # "@noted/shared-types"` rather than anything naming the real cause. A local
      # run does not reproduce it, because a developer's `dist/` is already there.
      - run: bun run build:types

      - run: bun run --filter @noted/backend lint

      - run: bun run --filter @noted/backend test

      - run: bun run build:backend

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # This step used to expand the entire `secrets` context with
      # `toJSON(secrets)`, and that is what holds deploys. A workflow that walks
      # every repository secret into a shell loop is shaped exactly like an
      # exfiltration payload, so GitHub creates the run with conclusion
      # `action_required` and ZERO jobs until a human clicks "Approve and run"
      # in the UI. The REST approve endpoint only serves fork pull requests, so
      # it cannot be automated, and the approval is per run — every deploy needs
      # a person.
      #
      # Enumerating is also least privilege. The old loop copied every secret
      # visible to the repo, so the org-wide CI credentials (NPM_TOKEN,
      # CLOUDFLARE_API_TOKEN, ADD_TO_PROJECT_TOKEN) ended up in this app's SSM
      # namespace, and this repo could overwrite the /oxy/_shared/* parameters
      # that other services read.
      #
      # The list is the secrets the `noted` task definition actually consumes.
      # Adding a new one means adding it here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
          APP_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          APP_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_OXY_APPLICATION_KEY: ${{ secrets.OXY_APPLICATION_KEY }}
          APP_OXY_APPLICATION_SECRET: ${{ secrets.OXY_APPLICATION_SECRET }}
          SHARED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SHARED_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SHARED_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"
          sync_secret SERVICE_SECRET "$APP_SERVICE_SECRET" "/oxy/$APP/SERVICE_SECRET"
          sync_secret VAPID_PUBLIC_KEY "$APP_VAPID_PUBLIC_KEY" "/oxy/$APP/VAPID_PUBLIC_KEY"
          sync_secret VAPID_PRIVATE_KEY "$APP_VAPID_PRIVATE_KEY" "/oxy/$APP/VAPID_PRIVATE_KEY"
          sync_secret VAPID_SUBJECT "$APP_VAPID_SUBJECT" "/oxy/$APP/VAPID_SUBJECT"
          sync_secret OXY_APPLICATION_KEY "$APP_OXY_APPLICATION_KEY" "/oxy/$APP/OXY_APPLICATION_KEY"
          sync_secret OXY_APPLICATION_SECRET "$APP_OXY_APPLICATION_SECRET" "/oxy/$APP/OXY_APPLICATION_SECRET"
          sync_secret AWS_ACCESS_KEY_ID "$SHARED_AWS_ACCESS_KEY_ID" "/oxy/_shared/AWS_ACCESS_KEY_ID"
          sync_secret AWS_SECRET_ACCESS_KEY "$SHARED_AWS_SECRET_ACCESS_KEY" "/oxy/_shared/AWS_SECRET_ACCESS_KEY"

          # Valkey lives in the cluster's region; a URL from another region
          # leaves the service silently without a cache, so it is rejected.
          if [ -n "$SHARED_REDIS_URL" ] && [ "$SHARED_REDIS_URL" != "-" ] &&
             ! printf '%s' "$SHARED_REDIS_URL" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
            echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
          else
            sync_secret REDIS_URL "$SHARED_REDIS_URL" "/oxy/_shared/REDIS_URL"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/arm64)
        id: build
        run: |
          set -euo pipefail
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest"
            exit 1
          fi
          echo "image_uri=$IMG@$DIGEST" >>"$GITHUB_OUTPUT"

      - name: Register immutable task definition
        id: task_definition
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP")
          if [ "$(jq -r '.services[0].status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::ECS service $APP is not active"
            exit 1
          fi

          for parameter in OXY_APPLICATION_KEY OXY_APPLICATION_SECRET; do
            aws ssm get-parameter --name "/oxy/$APP/$parameter" --query 'Parameter.Name' --output text >/dev/null
          done

          current_task_definition=$(jq -r '.services[0].taskDefinition' <<<"$service_json")
          source_file=$(mktemp)
          rendered_file=$(mktemp)
          trap 'rm -f "$source_file" "$rendered_file"' EXIT
          aws ecs describe-task-definition --task-definition "$current_task_definition" \
            --query taskDefinition --output json >"$source_file"

          jq \
            --arg app "$APP" \
            --arg image "$IMAGE_URI" \
            --arg key "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/OXY_APPLICATION_KEY" \
            --arg secret "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/OXY_APPLICATION_SECRET" \
            '
              .containerDefinitions |= map(
                if .name == $app then
                  .image = $image
                  | .secrets = (
                      ((.secrets // []) | map(select(
                        .name != "OXY_APPLICATION_KEY" and
                        .name != "OXY_APPLICATION_SECRET"
                      ))) + [
                        {name: "OXY_APPLICATION_KEY", valueFrom: $key},
                        {name: "OXY_APPLICATION_SECRET", valueFrom: $secret}
                      ]
                    )
                else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt
                )
            ' "$source_file" >"$rendered_file"

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://$rendered_file" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$task_definition_arn" >>"$GITHUB_OUTPUT"

      # Migrations run BEFORE the rollout, as a one-shot task on the image that
      # is about to serve — so the schema the new tasks expect is already there
      # when the first of them starts.
      #
      # `--phase=pre` only: those migrations are additive and correct against
      # both the image still serving and the one arriving. Anything that drops,
      # renames or narrows is marked `post` and is NOT applied here; run it
      # deliberately once the rollout is live.
      #
      # `/health/ready` asserts the same journal independently. Neither replaces
      # the other: this step applies the migrations, that one survives the case
      # where a task somehow starts against a database this step never reached.
      #
      # The network configuration is read back from the running service rather
      # than written out here, so there is one place subnets and security groups
      # are defined and this cannot drift from it.
      - name: Apply pre-deploy migrations
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — nothing to migrate against, skipping"
            exit 0
          fi

          NETWORK=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].networkConfiguration' --output json)

          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$(jq -nc --arg app "$APP" '{
              containerOverrides: [{
                name: $app,
                command: ["node", "packages/backend/dist/migrate.js", "--target-database=noted", "--phase=pre"]
              }]
            }')")
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$TASK_ARN" ]; then
            echo "::error::ECS did not start the migration task: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          echo "migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$APP'].exitCode | [0]" --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::migration task exited $EXIT_CODE ($REASON) — not rolling out"
            exit 1
          fi
          echo "migrations applied"

      - name: Deploy immutable task definition to ECS
        id: ecs_deploy
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          update_json=$(aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP" \
            --task-definition "$TASK_DEFINITION")
          deployment_id=$(jq -r '.service.deployments[] | select(.status == "PRIMARY") | .id' <<<"$update_json" | head -1)
          if [ -z "$deployment_id" ]; then
            echo "::error::ECS returned no primary deployment id"
            exit 1
          fi

          aws ecs wait services-stable --cluster "$CLUSTER" --services "$APP"
          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP")
          primary=$(jq -c --arg id "$deployment_id" '.services[0].deployments[] | select(.id == $id)' <<<"$service_json")
          running=$(jq -r '.runningCount' <<<"$primary")
          desired=$(jq -r '.desiredCount' <<<"$primary")
          if [ "$(jq -r '.status' <<<"$primary")" != "PRIMARY" ] ||
             [ "$(jq -r '.rolloutState' <<<"$primary")" != "COMPLETED" ] ||
             [ "$desired" -lt 1 ] || [ "$running" -ne "$desired" ]; then
            echo "::error::deployment $deployment_id did not complete as the running primary"
            exit 1
          fi

          live_task_definition=$(jq -r '.services[0].taskDefinition' <<<"$service_json")
          live_image=$(aws ecs describe-task-definition --task-definition "$live_task_definition" \
            --query "taskDefinition.containerDefinitions[?name=='$APP'].image | [0]" --output text)
          if [ "$live_image" != "$IMAGE_URI" ]; then
            echo "::error::live image $live_image does not match built image $IMAGE_URI"
            exit 1
          fi
          curl --fail --silent --show-error "https://api.noted.oxy.so/health/ready" >/dev/null
          echo "deployed $APP as $live_task_definition ($live_image)"

      - name: Diagnose a failed ECS rollout
        if: ${{ failure() && steps.ecs_deploy.outcome == 'failure' }}
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
        run: |
          set -u
          echo "Service deployments and recent events:"
          aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].{deployments:deployments[*].{id:id,status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount,failed:failedTasks},events:events[0:10].{createdAt:createdAt,message:message}}' \
            --output json || true

          task_arns=$(aws ecs list-tasks --cluster "$CLUSTER" --family "oxy-$APP" \
            --desired-status STOPPED --max-results 25 --query 'taskArns' --output text || true)
          if [ -z "$task_arns" ] || [ "$task_arns" = "None" ]; then
            echo "No stopped oxy-$APP tasks were returned."
            exit 0
          fi

          aws ecs describe-tasks --cluster "$CLUSTER" --tasks $task_arns --output json \
            | jq --arg task_definition "$TASK_DEFINITION" '
                [.tasks[]
                  | select(.taskDefinitionArn == $task_definition)
                  | {
                      taskArn,
                      createdAt,
                      stoppedAt,
                      stopCode,
                      stoppedReason,
                      containers: [.containers[] | {
                        name,
                        lastStatus,
                        exitCode,
                        reason,
                        healthStatus
                      }]
                    }
                ]
                | sort_by(.stoppedAt)
                | reverse
                | .[0:10]
              ' || true

      # Publish discovery only after the matching handlers are healthy. If this
      # step has to be retried, the catalog endpoint is digest-idempotent.
      - name: Register canonical capability catalog
        env:
          TASK_DEFINITION: ${{ steps.task_definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          NETWORK=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].networkConfiguration' --output json)
          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$(jq -nc --arg app "$APP" '{
              containerOverrides: [{
                name: $app,
                command: ["node", "packages/backend/dist/register-capability-catalog.js"]
              }]
            }')")
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$TASK_ARN" ]; then
            echo "::error::ECS did not start catalog registration: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi
          echo "catalog registration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$APP'].exitCode | [0]" --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::capability catalog registration exited $EXIT_CODE ($REASON)"
            exit 1
          fi
          echo "capability catalog registered"
